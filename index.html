<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Here, not in a document::Meta: Dioxus inserts head components at
         runtime from WASM and link-preview scrapers do not run JavaScript.
         One card for the whole site; per-route cards need prerendering.
         No og:image (assets are content-hashed, so no stable URL) and no
         canonical (a single static one would claim every route is the root). -->
    <meta name="description" content="Deniz Horoz, software engineer. I develop helpful apps to solve people's problems." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="denizhoroz" />
    <meta property="og:title" content="denizhoroz — Software Engineer" />
    <meta property="og:description" content="Deniz Horoz, software engineer. I develop helpful apps to solve people's problems." />
    <meta property="og:url" content="https://denizhoroz.com/" />

    <meta name="twitter:card" content="summary" />

    <!-- Deliberately empty: dx APPENDS the Dioxus.toml title into an existing
         <title>, so any content here yields it twice. -->
    <title></title>

    <!-- Here rather than a document::Link for the same reason as the meta tags:
         these must be in the served HTML. A stylesheet Dioxus inserts after the
         WASM boots arrives too late to style the first paint, so the page would
         render in the fallback face and reflow once the real one lands.

         JetBrains Mono weights 400-700 cover the chrome: body text,
         .nav-active's font-semibold (600) and the card titles' font-bold (700).

         Fragment Mono is the project write-up face (.markdown-body) and ships
         one weight, 400, plus its italic -- there is no bold cut, so the
         markdown headings and any **strong** in a body are synthesised by the
         browser. That is the trade for the face; do not "fix" it by adding a
         weight axis the family does not have.

         One request, two families: a second css2 URL is a second round trip for
         the same connection. display=swap shows the fallback immediately
         instead of blocking text on the download. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Fragment+Mono:ital@0;1&display=swap"
    />

    <!-- Theme, resolved before first paint. Must be inline and synchronous, and
         must NOT live in the Dioxus app: that only starts once the WASM boots,
         so a returning dark-mode reader would get a full-screen flash of light
         on every load. Light is the default: only an explicit stored choice
         turns the site dark, the OS preference is deliberately not consulted.
         try/catch because localStorage throws outright in some privacy modes. -->
    <script>
      (() => {
        let dark = false;
        try {
          dark = localStorage.getItem("theme") === "dark";
        } catch (_) {}
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
